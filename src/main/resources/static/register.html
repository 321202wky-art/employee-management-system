<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 员工信息管理系统</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/lib/element-plus.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="app">
    <div class="register-container">
        <div class="register-card">
            <h2>注册账号</h2>
            <el-form ref="formRef" :model="form" :rules="rules" label-width="0">
                <el-form-item prop="username">
                    <el-input v-model="form.username" placeholder="用户名(3-50位)" size="large" prefix-icon="User"></el-input>
                </el-form-item>
                <el-form-item prop="password">
                    <el-input v-model="form.password" type="password" placeholder="密码(6位以上)" size="large" prefix-icon="Lock" show-password></el-input>
                </el-form-item>
                <el-form-item prop="confirmPassword">
                    <el-input v-model="form.confirmPassword" type="password" placeholder="确认密码" size="large" prefix-icon="Lock" show-password></el-input>
                </el-form-item>
                <el-form-item>
                    <el-button type="primary" size="large" :loading="loading" @click="handleRegister">注册</el-button>
                </el-form-item>
            </el-form>
            <div class="link">已有账号？<a href="/login.html">返回登录</a></div>
        </div>
    </div>
</div>

<script src="/lib/vue.global.prod.js"></script>
<script src="/lib/axios.min.js"></script>
<script src="/lib/element-plus.min.js"></script>
<script src="/js/register.js"></script>
</body>
</html>
