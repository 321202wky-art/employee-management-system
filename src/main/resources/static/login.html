<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 员工信息管理系统</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/lib/element-plus.css">
    <script src="/lib/vue.global.prod.js"></script>
    <script src="/lib/axios.min.js"></script>
    <script src="/lib/element-plus.min.js"></script>
    <script src="/js/login.js" defer></script>
</head>
<body>
    <div id="app">
        <div v-show="!showLoading" style="
            position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
            width: 380px; padding: 36px; background: #f0f2f5; border-radius: 12px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.12);
        ">
            <h2 style="text-align:center; color:#333; margin-bottom:24px;">员工管理系统</h2>
            <el-form :model="form" :rules="rules" ref="formRef" size="large">
                <el-form-item prop="username">
                    <el-input v-model="form.username" placeholder="请输入用户名" />
                </el-form-item>
                <el-form-item prop="password">
                    <el-input v-model="form.password" type="password" placeholder="请输入密码" show-password />
                </el-form-item>
                <el-form-item prop="captchaCode">
                    <div style="display:flex; gap:8px; align-items:center;">
                        <el-input v-model="form.captchaCode" placeholder="验证码" maxlength="4" @keyup.enter="handleLogin" style="flex:1;" />
                    </div>
                </el-form-item>
                <div style="text-align:right;margin-top:-58px;margin-bottom:18px;">
                    <div id="captcha-image" @click="loadCaptcha" title="点击刷新" style="width:120px;height:42px;cursor:pointer;border:1px solid #d9d9d9;border-radius:4px;background-size:cover;background-position:center;background-color:#e0e0e0;display:inline-flex;align-items:center;justify-content:center;font-size:11px;color:#666;">加载中...</div>
                    <div style="font-size:12px;color:#409eff;margin-top:4px;">
                        <span @click="loadCaptcha" style="cursor:pointer;">看不清，换一张</span>
                    </div>
                </div>
                <el-form-item>
                    <el-button type="primary" :loading="loading" @click="handleLogin" style="width:100%;height:40px;font-size:16px;">
                        {{ loading ? '登录中...' : '登录' }}
                    </el-button>
                </el-form-item>
            </el-form>
            <div style="text-align:center;margin-top:12px;">
                <a href="/register.html" style="color:#409eff;font-size:13px;text-decoration:none;">还没有账号？立即注册</a>
            </div>
        </div>
        <div v-if="showLoading" style="
            position:fixed;top:0;left:0;width:100%;height:100%;
            background:rgba(0,0,0,0.8);display:flex;flex-direction:column;
            align-items:center;justify-content:center;z-index:9999;
        ">
            <div style="
                width:50px;height:50px;border:4px solid rgba(255,255,255,0.2);
                border-top:4px solid #fff;border-radius:50%;
                animation:spin 0.8s linear infinite;
            "></div>
            <p style="color:#fff;margin-top:16px;font-size:15px;">登录成功，正在进入系统...</p>
        </div>
    </div>
    <style>
        @keyframes spin { to { transform: rotate(360deg); } }
        body { margin:0; background:#e8edf2; font-family:'Microsoft YaHei',sans-serif; min-height:100vh; }
        .el-input__wrapper { background:#fff !important; }
    </style>
</body>
</html>
